name: Deploy to Tencent Cloud

# 触发：推送（含 PR 合并）到 main 分支时立即自动部署
on:
  push:
    branches: [main]
  # 也可在 Actions 页面手动触发，方便调试
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 登录服务器并部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # 登录后直接跑仓库里的一键更新脚本
          script: |
            set -e
            bash /home/ubuntu/nutrilens/deploy/update.sh
